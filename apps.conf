# Registry of apps this VPS deploys, read by deploy.sh.
# One line per app: <name>=<git-clone-url>
#
# <name> is also the directory name under /srv/ on the server
# (/srv/<name>) and must match an apps/<name>/ directory in this project.
#
# Add a new app here when it's actually ready for a first real deploy —
# not speculatively ahead of that.

diet-helper=git@github.com-diet-helper:UriBaynesay/diet-helper.git
fitness-tracker=git@github.com-fitness-tracker:UriBaynesay/fitness-tracker.git
feed=git@github.com-feed:UriBaynesay/feed.git
