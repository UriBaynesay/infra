# diet-helper: public hostname -> the app container's loopback-only port.
# Certificate from `certbot certonly --nginx -d diet.v1vpa.duckdns.org`
# (renewed automatically by certbot's systemd timer).

server {
    listen 80;
    listen [::]:80;
    server_name diet.v1vpa.duckdns.org;

    # The redirect lives inside `location /`, not at server level: at renewal
    # time certbot's nginx authenticator injects an exact-match location for
    # /.well-known/acme-challenge/<token>, and an exact match beats this prefix
    # match. A server-level `return` would run first and break renewal.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name diet.v1vpa.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/diet.v1vpa.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diet.v1vpa.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The app caps label photos at 10 MB (MAX_UPLOAD_BYTES); nginx's own
    # default of 1 MB would answer 413 before the app ever saw the request.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The extract route awaits the Claude call inline, which can run past
        # nginx's default 60s read timeout.
        proxy_read_timeout 120s;
    }
}
