# diet-helper: public hostname -> the app container's loopback-only port.
# Stage 1 (HTTP only). Stage 2 adds the 443 block once the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name diet.v1vpa.duckdns.org;

    # The app caps label photos at 10 MB (MAX_UPLOAD_BYTES); nginx's own
    # default of 1 MB would answer 413 before the app ever saw the request.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The extract route awaits the Claude call inline, which can run past
        # nginx's default 60s read timeout.
        proxy_read_timeout 120s;
    }
}
