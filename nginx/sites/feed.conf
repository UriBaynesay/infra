# feed: public hostname -> the api container's loopback-only port
# (Fastify serves the REST API, the MCP endpoint and the built web app on 3002).
# Certificate from `certbot certonly --nginx -d feed.v1vpa.duckdns.org`
# (renewed automatically by certbot's systemd timer).

server {
    listen 80;
    listen [::]:80;
    server_name feed.v1vpa.duckdns.org;

    # Redirect inside `location /`, not at server level, so certbot's renewal
    # challenge location (exact match) can win over this prefix match.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name feed.v1vpa.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/feed.v1vpa.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feed.v1vpa.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Pushes are small JSON (the app caps them at 256 KB); keep nginx's own cap just above.
    client_max_body_size 300k;

    # The MCP endpoint carries its secret token IN THE URL (/mcp/<token>), so:
    #  - access_log off: nginx's default log format records the request path, which would
    #    write the token to disk. (error_log can still print a URL on a proxy error, but
    #    only the unmasked path of a failed upstream, which is a rare, local-only file.)
    #  - proxy_buffering off + a long read timeout: the MCP streamable-HTTP transport may
    #    answer as an event stream, and buffering would hold the stream back.
    # The app never answers 401 here (a challenge could make the connector start OAuth).
    location /mcp/ {
        access_log off;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app rate-limits the login per client IP and only trusts these headers
        # because its port is loopback-only, so nginx must set them, never pass them through.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
