# fitness-tracker: public hostname -> the api container's loopback-only port
# (Fastify serves both the API and the built web app on 3001).
# Stage 1 (HTTP only). Stage 2 adds the 443 block once the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name fitness.v1vpa.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app rate-limits per client IP and only trusts these headers because
        # its port is loopback-only, so nginx must set them, never pass them through.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
