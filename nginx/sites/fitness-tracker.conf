# fitness-tracker: public hostname -> the api container's loopback-only port
# (Fastify serves both the API and the built web app on 3001).
# Certificate from `certbot certonly --nginx -d fitness.v1vpa.duckdns.org`
# (renewed automatically by certbot's systemd timer).

server {
    listen 80;
    listen [::]:80;
    server_name fitness.v1vpa.duckdns.org;

    # Redirect inside `location /`, not at server level, so certbot's renewal
    # challenge location (exact match) can win over this prefix match.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fitness.v1vpa.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/fitness.v1vpa.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitness.v1vpa.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app rate-limits per client IP and only trusts these headers because
        # its port is loopback-only, so nginx must set them, never pass them through.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
